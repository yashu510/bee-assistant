<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bee - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #111111;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(240, 192, 64, 0.1);
      width: 100%;
      max-width: 400px;
      border: 1px solid #222;
    }
    h1 { text-align: center; color: #f0c040; margin-bottom: 8px; font-size: 26px; }
    .subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
    .tabs { display: flex; margin-bottom: 24px; border-radius: 12px; overflow: hidden; border: 2px solid #f0c040; }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      color: #f0c040;
      background: #111111;
      border: none;
      font-size: 14px;
    }
    .tab.active { background: #f0c040; color: #0a0a0a; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #333;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #1a1a1a;
      color: white;
      transition: border 0.2s;
    }
    input:focus { border-color: #f0c040; }
    input::placeholder { color: #555; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #f0c040;
      color: #0a0a0a;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #e0b030; }
    .forgot-link {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 12px;
    }
    .forgot-link a {
      color: #f0c040;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .forgot-link a:hover { text-decoration: underline; }
    .back-link {
      text-align: center;
      margin-top: 12px;
    }
    .back-link a {
      color: #888;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link a:hover { color: #f0c040; }
    .message { text-align: center; margin-top: 16px; font-size: 14px; }
    .error { color: #ef5350; }
    .success { color: #66bb6a; }
    .hidden { display: none; }
    .reset-title {
      text-align: center;
      color: #f0c040;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🐝 Bee</h1>
  <p class="subtitle">Your Personal AI Assistant</p>

  <!-- Tabs — only Login and Sign Up -->
  <div class="tabs" id="main-tabs">
    <button class="tab active" id="tab-login" onclick="showTab('login')">Login</button>
    <button class="tab" id="tab-register" onclick="showTab('register')">Sign Up</button>
  </div>

  <!-- Login Form -->
  <div id="login-form">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@email.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Your password"/>
    </div>
    <div class="forgot-link">
      <a onclick="showReset()">Forgot password?</a>
    </div>
    <button class="btn" onclick="login()">Login</button>
  </div>

  <!-- Register Form -->
  <div id="register-form" class="hidden">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="reg-name" placeholder="Your name"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="you@email.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Choose a password"/>
    </div>
    <button class="btn" onclick="register()">Create Account</button>
  </div>

  <!-- Reset Password Form — hidden by default -->
  <div id="reset-form" class="hidden">
    <div class="reset-title">🔑 Reset Password</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reset-email" placeholder="you@email.com"/>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="reset-new-password" placeholder="Enter new password"/>
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <input type="password" id="reset-confirm-password" placeholder="Confirm new password"/>
    </div>
    <button class="btn" onclick="resetPassword()">Reset Password</button>
    <div class="back-link">
      <a onclick="showTab('login')">← Back to Login</a>
    </div>
  </div>

  <div class="message" id="message"></div>
</div>

<script>
  function showTab(tab) {
    document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
    document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
    document.getElementById('reset-form').classList.add('hidden');
    document.getElementById('main-tabs').classList.remove('hidden');
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('message').innerText = '';
  }

  function showReset() {
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('register-form').classList.add('hidden');
    document.getElementById('reset-form').classList.remove('hidden');
    document.getElementById('main-tabs').classList.add('hidden');
    document.getElementById('message').innerText = '';
  }

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const msg = document.getElementById('message');
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.error) {
      msg.className = 'message error';
      msg.innerText = data.error;
    } else {
      msg.className = 'message success';
      msg.innerText = `Welcome back, ${data.name}!`;
      setTimeout(() => window.location.href = '/', 1000);
    }
  }

  async function register() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    const msg = document.getElementById('message');
    const res = await fetch('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (data.error) {
      msg.className = 'message error';
      msg.innerText = data.error;
    } else {
      msg.className = 'message success';
      msg.innerText = data.success;
      setTimeout(() => showTab('login'), 1500);
    }
  }

  async function resetPassword() {
    const email = document.getElementById('reset-email').value.trim();
    const newPassword = document.getElementById('reset-new-password').value.trim();
    const confirmPassword = document.getElementById('reset-confirm-password').value.trim();
    const msg = document.getElementById('message');

    if (!email || !newPassword || !confirmPassword) {
      msg.className = 'message error';
      msg.innerText = 'All fields are required.';
      return;
    }
    if (newPassword !== confirmPassword) {
      msg.className = 'message error';
      msg.innerText = 'Passwords do not match!';
      return;
    }
    if (newPassword.length < 6) {
      msg.className = 'message error';
      msg.innerText = 'Password must be at least 6 characters.';
      return;
    }

    const res = await fetch('/reset_password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, new_password: newPassword })
    });
    const data = await res.json();
    if (data.error) {
      msg.className = 'message error';
      msg.innerText = data.error;
    } else {
      msg.className = 'message success';
      msg.innerText = 'Password reset! Please login.';
      setTimeout(() => showTab('login'), 1500);
    }
  }
</script>
</body>
</html>
