<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bee - Email & Tasks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; min-height: 100vh; display: flex; flex-direction: column; }

    header { background: #111; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
    header h1 { color: #f0c040; font-size: 20px; }
    #home-btn { background: #1a1a1a; color: #f0c040; border: 1px solid #f0c040; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; text-decoration: none; }
    #home-btn:hover { background: #f0c040; color: #0a0a0a; }

    .main-layout { display: grid; grid-template-columns: 300px 1fr; flex: 1; height: calc(100vh - 60px); }

    .email-sidebar { background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #222; }
    .sidebar-header h3 { color: #f0c040; font-size: 14px; margin-bottom: 12px; }

    #connect-gmail-btn {
      display: block;
      width: 100%;
      background: #f0c040;
      color: #0a0a0a;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
    }
    #connect-gmail-btn:hover { background: #e0b030; }

    #gmail-status { font-size: 12px; color: #888; margin-top: 8px; text-align: center; }
    #gmail-status.connected { color: #66bb6a; }

    .email-filters { padding: 12px 16px; border-bottom: 1px solid #222; display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { background: #1a1a1a; color: #888; border: 1px solid #333; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
    .filter-btn:hover, .filter-btn.active { background: #f0c040; color: #0a0a0a; border-color: #f0c040; }

    #email-list { flex: 1; overflow-y: auto; }
    .email-item { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
    .email-item:hover { background: #1a1a1a; }
    .email-item.active { background: #1a1a2a; border-left: 3px solid #f0c040; }
    .email-item.unread .email-sender { font-weight: bold; color: white; }
    .email-sender { font-size: 13px; color: #aaa; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email-subject { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email-date { font-size: 11px; color: #444; margin-top: 4px; }
    .empty-state { padding: 40px 16px; text-align: center; color: #555; font-size: 14px; line-height: 1.8; }

    .email-panel { display: flex; flex-direction: column; }
    #bee-chat-area { flex: 1; display: flex; flex-direction: column; }
    #bee-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

    .bee-msg { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; border-bottom-left-radius: 4px; padding: 12px 16px; max-width: 85%; align-self: flex-start; font-size: 14px; line-height: 1.6; color: #eee; }
    .bee-msg .label { color: #f0c040; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
    .user-msg { background: #f0c040; color: #0a0a0a; border-radius: 16px; border-bottom-right-radius: 4px; padding: 12px 16px; max-width: 85%; align-self: flex-end; font-size: 14px; font-weight: 500; }

    .email-preview { background: #111; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-top: 8px; font-size: 13px; color: #aaa; line-height: 1.6; }
    .email-preview .ep-subject { color: #f0c040; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
    .email-preview .ep-from { color: #888; font-size: 12px; margin-bottom: 8px; }
    .email-preview .ep-body { color: #ccc; }
    .action-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .action-btn { background: #1a1a1a; color: #f0c040; border: 1px solid #f0c040; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; }
    .action-btn:hover { background: #f0c040; color: #0a0a0a; }

    .quick-actions { padding: 12px 16px; border-top: 1px solid #222; display: flex; gap: 8px; flex-wrap: wrap; background: #0a0a0a; }
    .quick-btn { background: #1a1a1a; color: #888; border: 1px solid #333; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
    .quick-btn:hover { color: #f0c040; border-color: #f0c040; }

    #bee-input-area { background: #111; border-top: 1px solid #222; padding: 12px 16px; }
    #bee-input-row { display: flex; gap: 8px; background: #1a1a1a; border: 2px solid #333; border-radius: 28px; padding: 6px 10px; }
    #bee-input-row:focus-within { border-color: #f0c040; }
    #bee-input { flex: 1; background: none; border: none; outline: none; color: white; font-size: 14px; padding: 6px 4px; caret-color: #f0c040; }
    #bee-input::placeholder { color: #555; }
    #bee-send-btn { background: #f0c040; color: #0a0a0a; border: none; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }
    #bee-send-btn:hover { background: #e0b030; }

    .typing { color: #888; font-style: italic; font-size: 13px; padding: 4px 8px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #f0c040; }

    @media (max-width: 768px) {
      .main-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .email-sidebar { height: auto; max-height: 250px; }
    }
  </style>
</head>
<body>

<header>
  <h1>📧 Email & Tasks</h1>
  <a href="/" id="home-btn">🏠 Home</a>
</header>

<div class="main-layout">

  <!-- Left: Email List -->
  <div class="email-sidebar">
    <div class="sidebar-header">
      <h3>📬 Gmail</h3>
      <a href="/gmail/connect" id="connect-gmail-btn">🔗 Connect Gmail</a>
      <div id="gmail-status">Not connected</div>
    </div>

    <div class="email-filters">
      <button class="filter-btn active" onclick="filterEmails('inbox', this)">Inbox</button>
      <button class="filter-btn" onclick="filterEmails('unread', this)">Unread</button>
      <button class="filter-btn" onclick="filterEmails('sent', this)">Sent</button>
    </div>

    <div id="email-list">
      <div class="empty-state">
        🔗 Connect your Gmail above<br>to see your emails here
      </div>
    </div>
  </div>

  <!-- Right: Bee Chat -->
  <div class="email-panel">
    <div id="bee-chat-area">
      <div id="bee-messages"></div>
    </div>

    <div class="quick-actions">
      <button class="quick-btn" onclick="quickAction('summarize')">📋 Summarize inbox</button>
      <button class="quick-btn" onclick="quickAction('unread')">📩 Show unread</button>
      <button class="quick-btn" onclick="quickAction('important')">⭐ Important emails</button>
      <button class="quick-btn" onclick="quickAction('draft')">✏️ Draft a reply</button>
    </div>

    <div id="bee-input-area">
      <div id="bee-input-row">
        <input type="text" id="bee-input" placeholder="Ask Bee about your emails..."/>
        <button id="bee-send-btn" onclick="sendToBee()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
  let gmailConnected = false;
  let emails = [];
  let selectedEmail = null;
  let chatHistory = [];

  const beeInput = document.getElementById('bee-input');
  beeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendToBee(); }
  });

  window.onload = () => {
    addBeeMessage('Hi! I am Bee, your email assistant! Click "Connect Gmail" to connect your inbox. Then I can help you read emails, draft replies, and manage your tasks!');
    checkGmailStatus();
  };

  function addBeeMessage(text, emailData = null) {
    const msgs = document.getElementById('bee-messages');
    const div = document.createElement('div');
    div.classList.add('bee-msg');
    div.innerHTML = `<div class="label">🐝 Bee</div>${text}`;
    if (emailData) {
      const preview = document.createElement('div');
      preview.classList.add('email-preview');
      preview.innerHTML = `
        <div class="ep-subject">${emailData.subject}</div>
        <div class="ep-from">From: ${emailData.from}</div>
        <div class="ep-body">${emailData.snippet}</div>
        <div class="action-buttons">
          <button class="action-btn" onclick="draftReply('${emailData.id}')">✏️ Draft Reply</button>
          <button class="action-btn" onclick="summarizeEmail('${emailData.id}')">📋 Summarize</button>
        </div>`;
      div.appendChild(preview);
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addUserMessage(text) {
    const msgs = document.getElementById('bee-messages');
    const div = document.createElement('div');
    div.classList.add('user-msg');
    div.innerText = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById('bee-messages');
    const div = document.createElement('div');
    div.id = 'typing-ind';
    div.classList.add('typing');
    div.innerText = 'Bee is thinking...';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-ind');
    if (el) el.remove();
  }

  async function checkGmailStatus() {
    try {
      const res = await fetch('/gmail/status');
      const data = await res.json();
      if (data.connected) {
        gmailConnected = true;
        document.getElementById('connect-gmail-btn').innerText = '🔄 Refresh Emails';
        document.getElementById('gmail-status').innerText = '✅ Gmail Connected';
        document.getElementById('gmail-status').classList.add('connected');
        loadEmails();
      }
    } catch (e) {
      console.log('Status check failed');
    }
  }

  async function loadEmails(filter = 'inbox') {
    document.getElementById('email-list').innerHTML = '<div class="empty-state">Loading emails...</div>';
    try {
      const res = await fetch(`/gmail/emails?filter=${filter}`);
      const data = await res.json();
      if (data.error) {
        document.getElementById('email-list').innerHTML = `<div class="empty-state">${data.error}</div>`;
        return;
      }
      emails = data.emails || [];
      renderEmailList();
      document.getElementById('gmail-status').innerText = `✅ Connected • ${emails.length} emails`;
      document.getElementById('gmail-status').classList.add('connected');
      document.getElementById('connect-gmail-btn').innerText = '🔄 Refresh';
      gmailConnected = true;

      if (emails.length > 0) {
        addBeeMessage(`I found ${emails.length} emails in your inbox! Click any email to view it, or ask me anything about your emails.`);
      }
    } catch (e) {
      document.getElementById('email-list').innerHTML = '<div class="empty-state">Failed to load emails</div>';
    }
  }

  function renderEmailList() {
    const list = document.getElementById('email-list');
    if (emails.length === 0) {
      list.innerHTML = '<div class="empty-state">No emails found</div>';
      return;
    }
    list.innerHTML = emails.map((e, i) => `
      <div class="email-item ${e.unread ? 'unread' : ''}" onclick="selectEmail(${i})">
        <div class="email-sender">${e.from}</div>
        <div class="email-subject">${e.subject}</div>
        <div class="email-date">${e.date}</div>
      </div>
    `).join('');
  }

  function selectEmail(index) {
    selectedEmail = emails[index];
    document.querySelectorAll('.email-item').forEach((el, i) => {
      el.classList.toggle('active', i === index);
    });
    addBeeMessage(`Here is the email from ${selectedEmail.from}:`, selectedEmail);
  }

  function filterEmails(filter, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (gmailConnected) loadEmails(filter);
  }

  async function quickAction(action) {
    if (!gmailConnected) {
      addBeeMessage('Please connect your Gmail first by clicking "Connect Gmail" above!');
      return;
    }
    const prompts = {
      'summarize': 'Summarize my inbox for me',
      'unread': 'Show me my unread emails',
      'important': 'Which emails are most important?',
      'draft': 'Help me draft a reply to an email'
    };
    const text = prompts[action];
    addUserMessage(text);
    await askBeeAboutEmails(text);
  }

  async function sendToBee() {
    const text = beeInput.value.trim();
    if (!text) return;
    beeInput.value = '';
    addUserMessage(text);
    await askBeeAboutEmails(text);
  }

  async function askBeeAboutEmails(userMessage) {
    showTyping();
    let emailContext = '';
    if (emails.length > 0) {
      emailContext = `The user has ${emails.length} emails. Here are the recent ones:\n` +
        emails.slice(0, 10).map((e, i) =>
          `${i+1}. From: ${e.from} | Subject: ${e.subject} | Preview: ${e.snippet}`
        ).join('\n');
    }
    if (selectedEmail) {
      emailContext += `\n\nCurrently selected email:\nFrom: ${selectedEmail.from}\nSubject: ${selectedEmail.subject}\nContent: ${selectedEmail.body || selectedEmail.snippet}`;
    }
    chatHistory.push({ role: 'user', content: userMessage });
    try {
      const res = await fetch('/email/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: userMessage,
          email_context: emailContext,
          history: chatHistory
        })
      });
      const data = await res.json();
      hideTyping();
      const reply = data.reply || 'Something went wrong.';
      chatHistory.push({ role: 'assistant', content: reply });
      addBeeMessage(reply);
    } catch (e) {
      hideTyping();
      addBeeMessage('Something went wrong. Please try again.');
    }
  }

  async function draftReply(emailId) {
    const email = emails.find(e => e.id === emailId) || selectedEmail;
    if (!email) return;
    addUserMessage(`Draft a reply to: ${email.subject}`);
    await askBeeAboutEmails(`Please draft a professional reply to this email from ${email.from} with subject "${email.subject}". Content: ${email.snippet}`);
  }

  async function summarizeEmail(emailId) {
    const email = emails.find(e => e.id === emailId) || selectedEmail;
    if (!email) return;
    addUserMessage('Summarize this email');
    await askBeeAboutEmails(`Summarize this email from ${email.from}: Subject: ${email.subject}. Content: ${email.snippet}`);
  }
</script>
</body>
</html>
